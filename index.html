<script>
const $=id=>document.getElementById(id),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hs=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)};
const R={admin:'Admin',helper:'Helper',user:'Học sinh'};
let D=null;try{D=JSON.parse(localStorage.getItem('lvth'))}catch(e){}
D=Object.assign({users:[],cfg:{},years:[],docs:[],books:[],posts:[],rem:[]},D||{});
let me=null,page='home',Y=null,C=null,B=null,T={mode:'rand',used:[],cur:null,n:2,words:'văn chương, thi ca, tâm hồn, ẩn dụ, điệp ngữ, hạnh phúc',w:null};
try{const u=localStorage.getItem('lvth_me');me=D.users.find(x=>x.u===u)||null;if(me&&me.off)me=null}catch(e){}
try{const c=localStorage.getItem('lvth_color');if(c)document.documentElement.style.setProperty('--c',c)}catch(e){}
const idb={o(){return new Promise((ok,no)=>{const r=indexedDB.open('lvth',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},async get(){const d=await this.o();return new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get('D');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},async set(v){const d=await this.o();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'D');t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}};
let svS='idle',lastSave=null,dirty=false,svT;
const svTxt0=()=>svS==='save'?'⟳ Đang lưu…':svS==='err'?'⚠ Lưu thất bại - hãy xuất file sao lưu':lastSave?'✓ Đã tự động lưu '+lastSave:'✓ Tự động lưu đang bật';
const setSv=s=>{svS=s;const e=$('sv');if(e)e.textContent=svTxt()};
const stamp=()=>{lastSave=new Date().toLocaleTimeString('vi',{hour:'2-digit',minute:'2-digit'});setSv('ok')};
function save(){D.ts=Date.now();bkSched();psSched();dirty=true;setSv('save');clearTimeout(svT);svT=setTimeout(flush,300)}
async function flush(){clearTimeout(svT);if(!dirty)return;dirty=false;try{await idb.set(D);stamp()}catch(e){try{localStorage.setItem('lvth',JSON.stringify(D));stamp()}catch(x){dirty=true;setSv('err');toast('Không lưu được: trình duyệt đang chặn hoặc hết bộ nhớ')}}}

function toast(m){const t=$('t');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',2600)}
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
const ed=()=>me&&me.role!=='user',ad=()=>me&&me.role==='admin';
function render(){
 const b=D.cfg.bg;document.body.style.backgroundImage=b&&b[0]!=='#'?`url(${b})`:'none';if(b&&b[0]==='#')document.body.style.backgroundColor=b;
 const head=`<header>${D.cfg.logo?`<img src="${D.cfg.logo}" alt="">`:'<span style="font-size:46px">📖</span>'}<div><h1 class="brand">Lớp văn thầy Hiếu</h1><small class="slg"><span class="s1">Lớp văn thầy Hiếu - Lớp học hạnh phúc</span></small></div><span class="sp"></span>${me?`<span>${H(me.name||me.u)} · ${R[me.role]}</span><button onclick="out()">Thoát</button>`:''}</header>`;
 if(!me){$('app').innerHTML=head+loginView()+FT;return}
 const tabs=[['class','👥 Quản lý lớp'],['tools','🎲 Công cụ dạy học'],['game','🎮 Trò chơi'],['att','🗓️ Điểm danh'],['hw','📝 Giao bài'],['kg','🏰 Vương quốc'],['docs','📄 Tài liệu'],['books','📚 Đọc sách'],['blog','✍️ Blog văn chương'],['rem','⏰ Nhắc lịch'],['set','⚙️ Cài đặt']].filter(t=>ed()||!['class','tools','game','att','hw'].includes(t[0]));tabs.unshift(['home','🏠 Tổng quan']);if(me.srv){tabs.length=0;tabs.push(['kg','🏰 Vương quốc'],['pw','🔑 Mật khẩu'])}

 const v={home:pHome,class:pClass2,tools:pTools,game:pGame,att:pAtt,hw:pHw,kg:pKg,docs:()=>pList('docs','Tài liệu dạy học'),books:pBooks,blog:()=>pList('posts','Blog văn chương'),rem:pRem,set:pSet,pw:pPwSrv}[page]();
 $('app').innerHTML=head+`<nav>${tabs.map(t=>`<button class="${t[0]===page?'on':''}" onclick="page='${t[0]}';B=null;render()">${t[1]}</button>`).join('')}</nav><main>${v}</main>${FT}`;
}

let TM='k1';
const CN=['TX1','TX2','TX3','TX4','Giữa kì','Cuối kì'],WT=[1,1,1,1,2,3],WS=9,f2=v=>v==null?'–':v.toFixed(2);
function tb(a){let s=0,w=0;WT.forEach((k,i)=>{const v=a&&a[i];if(v!==''&&v!=null&&!isNaN(v)){s+=v*k;w+=k}});return{s,w,a:w?s/w:null}}
function yr(s){const x=tb(s.k1).a,y=tb(s.k2).a;return x!=null&&y!=null?(x+2*y)/3:null}
function nd(a,g){const{s,w}=tb(a),r=WS-w;if(!r)return s/WS>=g?'Đã đạt mục tiêu':'Chưa đạt mục tiêu';const q=(g*WS-s)/r;return q<=0?'Đã đạt mục tiêu':q>10?`Khó đạt (cần ${q.toFixed(1)})`:`Cần TB ${q.toFixed(2)} ở các cột còn lại`}
function ndY(s,g){const x=tb(s.k1),y=tb(s.k2);if(x.a==null)return 'Chưa có điểm kì 1';if(y.w===WS)return yr(s)>=g?'Đã đạt mục tiêu':'Chưa đạt mục tiêu';const q=(g*3-x.a)/2;return q<=0?'Đã đạt mục tiêu':q>10?`Khó đạt (kì 2 cần ${q.toFixed(1)})`:`Kì 2 cần TB ${q.toFixed(2)}`}
function enc(a,s,pv){
 if(a==null)return 'Chưa có điểm. Thầy tin em sẽ làm tốt!';
 const h=[...s.n].reduce((x,c)=>x+c.charCodeAt(0),0);
 const L=a>=9?['Xuất sắc! Em giữ vững phong độ và giúp đỡ các bạn nhé.','Điểm số tuyệt vời, thầy rất tự hào về em!']:a>=8?['Rất tốt! Thêm chút nỗ lực nữa là chạm mốc xuất sắc.','Em học đều và chắc, cố gắng thêm ở các bài kiểm tra lớn nhé.']:a>=6.5?['Khá ổn! Đọc thêm và luyện viết đều đặn, em sẽ tiến xa hơn.','Em có năng lực, chỉ cần kiên trì thêm một chút nữa thôi.']:a>=5?['Em đã có nền tảng rồi. Chăm hơn một chút, điểm sẽ tăng ngay.','Đừng ngại hỏi thầy khi chưa hiểu, mình cùng cố gắng nhé.']:['Đừng nản nhé! Mỗi bước nhỏ đều là tiến bộ, thầy sẽ cùng em cố gắng.','Em chưa phải bỏ cuộc đâu, hãy bắt đầu từ những bài dễ rồi tăng dần nhé.'];
 let t=L[h%L.length];
 if(pv!=null){if(a-pv>=.5)t+=' Em đã tiến bộ so với kì trước!';else if(pv-a>=.5)t+=' Điểm giảm đôi chút so với kì trước, mình cùng lấy lại phong độ nhé.'}
 const n=s.calls.length;if(n>=3&&s.calls.filter(x=>x.ok).length/n>=.7)t+=' Em phát biểu rất tích cực!';
 return t}

 <p class="mu" style="margin:0 0 8px">${Yr?'Cả năm = (Kì 1 × 1 + Kì 2 × 2) ÷ 3':'4 cột thường xuyên (×1), Giữa kì (×2), Cuối kì (×3)'}</p>

 c.st.forEach((s,j)=>{let m;

  else{const a=s[TM],t=tb(a),pv=TM==='k2'?tb(s.k1).a:null,ca=s.calls.filter(x=>x.ok).length;m=CN.map((k,i)=>`<td><input class="n" type="number" min="0" max="10" step=".25" value="${a[i]??''}" onchange="sc2('${s.id}',${i},this.value)"></td>`).join('')+`<td><b>${f2(t.a)}</b>${t.a!=null&&t.w<WS?' <span class="mu">(tạm)</span>':''}</td>${gt(s,g)}<td class="mu">${nd(a,gl(s,g))}</td><td><span class="ok">${ca} Tốt</span> · <span class="no">${s.calls.length-ca} Chưa</span></td><td class="enc">${H(enc(t.a,s,pv))}</td>`}
  h+=`<tr><td>${j+1}</td><td>${H(s.n)} <a href="#" class="mu" title="Sửa tên" onclick="renSt('${s.id}');return false">✎</a></td>${m}<td><a href="#" class="d" onclick="delSt('${s.id}');return false">Xoá</a></td></tr>`});
 return h+'</table></div></div>';

function cp2(m){const c=C_();c.st.forEach(s=>{s.k1=s.k1||[];s.k2=s.k2||[]});const Yr=TM==='y';
 const t=m?(Yr?['Học sinh','TB kì 1','TB kì 2','Cả năm']:['Học sinh',...CN,'TB']).join('\t')+'\n'+c.st.map(s=>{const q=v=>v==null?'':v.toFixed(2);if(Yr)return[s.n,q(tb(s.k1).a),q(tb(s.k2).a),q(yr(s))].join('\t');const a=s[TM];return[s.n,...CN.map((k,i)=>a[i]??''),q(tb(a).a)].join('\t')}).join('\n'):c.st.map(s=>s.n).join('\n');

const HS=[['ok','Đã nộp'],['late','Nộp muộn'],['no','Chưa nộp']],sub=(a,id)=>a.sub[id]||{},subN=a=>Object.values(a.sub).filter(v=>v.st==='ok'||v.st==='late').length;

 let h='<h2>Đọc sách cùng thầy Hiếu</h2>';
 if(ed())h+=`<div class="card"><input id="bt" placeholder="Tên sách"> <input type="file" id="bf" accept=".pdf,.txt,.epub"> <button class="p" onclick="addBook()">Tải lên</button><p class="mu">Hỗ trợ đọc trực tiếp PDF và TXT. Sách lưu trong trình duyệt nên nên dùng file nhỏ.</p></div>`;
 return h+`<div class="row" style="align-items:stretch">${D.books.map(b=>`<div class="card" style="width:170px;text-align:center"><div style="font-size:40px">📘</div><b>${H(b.t)}</b><br><button class="p" onclick="B='${b.id}';render()">Đọc</button>${ed()?` <button class="d" onclick="delBook('${b.id}')">Xoá</button>`:''}</div>`).join('')||'<div class="card mu">Tủ sách trống.</div>'}</div>`;
}
function addBook(){const f=$('bf').files[0],t=$('bt').value.trim()||(f&&f.name);if(!f)return toast('Chọn file sách');rd(f,x=>{D.books.push({id:uid(),t,f:x,fn:f.name});save();render()})}
function delBook(id){if(confirm('Xoá sách?')){D.books=D.books.filter(x=>x.id!==id);save();render()}}

/* ---- Nhắc lịch ---- */
function pRem(){
 const l=D.rem.filter(r=>r.o===me.u).sort((a,b)=>a.d.localeCompare(b.d)),now=new Date().toISOString().slice(0,16);
 return `<h2>Nhắc lịch</h2><div class="card"><div class="row"><input id="rt" placeholder="Việc cần nhớ"><input id="rd" type="datetime-local"><button class="p" onclick="addRem()">Thêm</button></div></div>`+(l.map(r=>`<div class="card"><span style="${r.x?'text-decoration:line-through':''}">${H(r.t)}</span> <span class="${r.d<now&&!r.x?'no':'mu'}">${r.d.replace('T',' ')}${r.d<now&&!r.x?' · quá hạn':''}</span> <button onclick="tgRem('${r.id}')">${r.x?'Mở lại':'Xong'}</button> <button class="d" onclick="D.rem=D.rem.filter(x=>x.id!=='${r.id}');save();render()">Xoá</button></div>`).join('')||'<div class="card mu">Chưa có nhắc lịch.</div>');
}
function addRem(){const t=$('rt').value.trim(),d=$('rd').value;if(!t||!d)return toast('Nhập việc và thời gian');D.rem.push({id:uid(),o:me.u,t,d});save();render()}
function tgRem(id){const r=D.rem.find(x=>x.id===id);r.x=!r.x;save();render()}

function addUser(){const u=$('au').value.trim().toLowerCase(),p=$('ap').value;if(!u||p.length<4)return toast('Nhập tên và mật khẩu ≥4 ký tự');if(D.users.some(x=>x.u===u))return toast('Tên đã tồn tại');D.users.push({u,p:hs(p),role:$('ar').value,name:$('an').value||u});save();render()}

function kMe(){
 if(!me)return null;if(me.sid){for(const y of D.years)for(const c of y.classes){const s=c.st.find(x=>x.id===me.sid);if(s)return{s,c,y}}return null}const a=nz(me.name),b=nz(me.u);
 for(const y of D.years)for(const c of y.classes)for(const s of c.st){const z=nz(s.n);if(z&&(z===a||z===b))return{s,c,y}}
 return null}
let KQO=false;
function kQuiz(title,pool,n,done){
 const qs=shuf(pool).slice(0,n);let i=0,ok=0;
 let m=$('kq');if(!m){m=document.createElement('div');m.id='kq';document.body.appendChild(m)}
 (function step(){
  if(i>=qs.length){m.className='';m.innerHTML='';return done(ok,qs.length)}
  const q=qs[i];m.className='ov';
  m.innerHTML=`<div class="box"><div class="mu">${H(title)} · Câu ${i+1}/${qs.length}</div><h3 style="margin:6px 0 10px">${H(q.q)}</h3>`+
   shuf(q.o.map((o,k)=>[o,k])).map(x=>`<button class="opt" data-k="${x[1]}">${H(x[0])}</button>`).join('')+'</div>';
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.k===q.a)ok++;i++;step()});
 })()}

/* --- Học sinh --- */
function kView(o){
 const p=o.p,rk=o.rk,r=KR[rk],n=KR[rk+1];
 const pct=n?Math.max(0,Math.min(100,Math.round((p-r.min)/(n.min-r.min)*100))):100;
 let tb;
 if(!n)tb='<button disabled>Đã đạt cấp cao nhất</button>';
 else if(p<n.min)tb=`<button disabled>Cần thêm ${n.min-p} điểm để thi lên ${n.n}</button>`;
 else if(o.wait)tb='<button disabled>Chờ 10 phút để thi lại</button>';
 else tb=`<button onclick="${o.onT}">Thi thăng chức lên ${n.n}</button>`;
 return `<h2>🏰 Vương quốc lớp ${H(o.cls)}</h2>
${o.dec?`<div class="card">📯 <b>Sắc lệnh nhà vua:</b> ${H(o.dec)}</div>`:''}
<div class="card hero"><div class="row">${kBadge(rk,56)}<div><b style="font-size:17px">${H(o.name)}</b><br><span class="mu">${r.n} · ${p} điểm</span></div></div>
<div class="kb" style="margin:10px 0"><i style="width:${pct}%"></i></div>
<div class="mu">${n?`Tiến độ tới ${n.n} (${n.min} điểm)`:'Bạn đã là người đứng đầu hệ thống cấp bậc!'}</div>
<div class="row" style="margin-top:10px"><button onclick="${o.onD}" ${o.daily?'disabled':''}>Thử thách ngày (+1đ/câu đúng)</button>${tb}</div></div>
${o.res}
<div class="card"><h3 style="margin-top:0">Quyền lợi theo cấp bậc</h3>${KR.map((x,i)=>`<div style="display:flex;align-items:center;gap:10px;margin:8px 0;opacity:${i<=rk?1:.5}">${kBadge(i,28)}<span><b>${x.n}</b> (từ ${x.min}đ): ${x.p}</span></div>`).join('')}</div>`}
function kStu(){
 const f=kMe();
 if(!f)return '<div class="card">Chưa tìm thấy em trong danh sách lớp. Hãy nhờ thầy tạo tài khoản có họ tên trùng với tên trong danh sách lớp.</div>';
 const{s,c}=f;
 return kView({name:s.n,cls:c.name,p:s.kp||0,rk:s.kr||0,dec:kd().dec[c.id],daily:s.kd===kToday(),wait:Date.now()-(s.kf||0)<600000,onD:'kDaily()',onT:'kTest()',res:kRes(s,c)})}
function kDaily(){
 const f=kMe();if(!f)return;const{s}=f;if(s.kd===kToday())return;
 const q=kd().qs,pool=q.filter(x=>x.lv<=(s.kr||0)+1);
 kQuiz('Thử thách ngày',pool.length?pool:q,3,(ok,t)=>{s.kd=kToday();s.kp=(s.kp||0)+ok;save();render();toast(`Đúng ${ok}/${t} câu, nhận +${ok} điểm!`)})}
function kTest(){
 const f=kMe();if(!f)return;const{s}=f,rk=s.kr||0,n=KR[rk+1];
 if(!n||(s.kp||0)<n.min||Date.now()-(s.kf||0)<600000)return;
 const q=kd().qs;let pool=q.filter(x=>x.lv===rk+1);if(pool.length<3)pool=q;
 kQuiz('Thi thăng chức',pool,5,(ok,t)=>{const need=Math.ceil(t*.8);
  if(ok>=need){s.kr=rk+1;save();render();toast(`Đúng ${ok}/${t}! Thăng chức ${KR[s.kr].n}!`)}
  else{s.kf=Date.now();save();render();toast(`Đúng ${ok}/${t}, cần tối thiểu ${need}. Thử lại sau 10 phút.`)}})}

 :r.g==='boss'?`<div class="g3"><div class="g3in" style="text-align:center"><div class="boss">👾</div><div class="hp"><i style="width:${Math.max(0,r.hp)}%"></i></div><div class="lb">Máu boss: ${Math.max(0,r.hp)}/100 · Tim của đội: ${'♥'.repeat(Math.max(0,r.hearts))}</div></div></div>`
 :r.g==='arch'?`<div class="g3"><div class="g3in" style="display:flex;justify-content:center"><div class="tg">${r.hx!=null&&r.ph==='res'?`<i class="ar" style="left:${r.hx}px;top:${r.hy}px"></i>`:''}</div></div></div>`
 :r.g==='bomb'?`<div class="bw"><div class="bomb${r.tl<=4&&r.ph==='ask'?' hot':''}" id="bm"><span id="bt">${r.tl}</span></div></div>`
 :`<div class="cg">${r.cards.map((c,i)=>`<div class="cd${c.o?' o':''}" id="cd${i}" onclick="gmPick(${i})"><div class="ci"><div class="cf">?</div><div class="cb">${H(gpTxt(c))}</div></div></div>`).join('')}</div>`;
 let pn;
 if(r.ph==='end'){const w=r.win||[...r.tm].sort((a,b)=>b.sc-a.sc)[0];pn=`<div class="big">Chiến thắng: ${w.ico} ${H(w.n)}</div>${w.m.length?`<p class="mu" style="text-align:center">${H(w.m.join(', '))}</p>`:''}<div class="row" style="justify-content:center"><button class="p" onclick="gmStart()">Chơi lại</button><button onclick="GM.run=null;GM.scr=0;render()">Chọn trò khác</button></div>`}
 else if(r.ph==='pick')pn=`<div class="big" style="font-size:22px">${t.ico} ${H(t.n)} chọn 1 thẻ!</div>`;
 else pn=`<div class="mu">${t.ico} <b>${H(t.n)}</b>${t.m.length?' · '+H(t.m.join(', ')):''} · kế tiếp: ${H(r.tm[(r.t+1)%r.tm.length].n)}</div><h3 style="margin:6px 0">${H(r.q.q)}</h3>`+r.q.o.map((o,k)=>`<button class="op${done?(k===r.q.c?' ok2':k===r.last?' bad2':''):''}" ${done?'disabled':''} ${r.hid.includes(k)?'style="visibility:hidden"':''} onclick="gmAns(${k})">${'ABCD'[k]}. ${H(o)}</button>`).join('')+(r.g==='ladder'&&r.ph==='ask'&&t.ll?`<button onclick="gmLL()">Quyền trợ giúp 50:50</button>`:'')+(r.ph==='res'?`<p class="big" style="font-size:20px">${H(r.msg)}</p><button class="p" onclick="gmNext()">Tiếp tục</button>`:'');
 return `<div class="row"><b>${{tower:'Xây tháp 3D',boss:'Đấu boss',arch:'Bắn cung 3D',race:'Đua thú 3D',dice:'Xúc xắc 3D',flip:'Lật thẻ bất ngờ',wheel:'Vòng quay may rủi',ladder:'Ai là triệu phú',bomb:'Bom hẹn giờ'}[r.g]}</b><span class="sp"></span><button onclick="if(confirm('Thoát trò chơi?')){GM.run=null;render()}">Thoát</button></div><div>${sb}</div>${bd}${pn}`}
function gmPick(i){const r=GM.run,c=r&&r.cards[i];if(!c||r.ph!=='pick'||c.o)return;r.pc=c;r.ph='ask';gmQ();gmUp();requestAnimationFrame(()=>requestAnimationFrame(()=>{const e=$('cd'+i);if(e)e.classList.add('o');c.o=1}))}
function gmAns(k){const r=GM.run;if(!r||r.ph!=='ask')return;const t=r.tm[r.t],ok=k===r.q.c;r.last=k;
 if(r.g==='flip'){const c=r.pc;if(ok){if(c.x)t.sc*=2;else t.sc+=c.s;r.msg='Chính xác! '+gpTxt(c)+' cho '+t.n}else r.msg='Tiếc quá! '+(c.pen?'Hình phạt vui: '+c.pen:'Lần này không được điểm.')}
 else if(r.g==='race'){if(ok){t.st++;const s=t.st>=2?2:1;t.pos+=s;r.msg=t.n+(s>1?' tăng tốc vèo vèo, +2 bước!':' tiến thêm 1 bước!')}else{t.st=0;const b=Math.random()<.4&&t.pos>0;if(b)t.pos--;r.msg=t.n+' '+gmRn(GFN)+'!'+(b?' Lùi 1 bước.':'')}
  if(t.pos>=r.goal){r.win=t;r.msg+=' Về đích đầu tiên!'}}
 else if(r.g==='wheel'){r.tc++;if(ok){r.ph='roll';r.w=Math.random()*GPW.length|0;gmUp();requestAnimationFrame(()=>requestAnimationFrame(()=>{const e=$('wh');if(e)e.style.transform=`rotate(${2160-(r.w*45+22.5)}deg)`}));
  setTimeout(()=>{if(GM.run!==r)return;const p=GPW[r.w];if(p.x)t.sc*=2;else t.sc=Math.max(0,t.sc+p.s);r.msg='Vòng quay dừng ở '+p.t+' cho '+t.n+'!';r.ph='res';gmUp()},3300);return}
  r.msg=t.n+' '+gmRn(GFN)+', không được quay!'}
 else if(r.g==='ladder'){if(ok){t.pos++;r.msg=t.n+' lên bậc '+t.pos+'!'+(t.pos%5===0&&t.pos<r.goal?' Đã tới mốc an toàn!':'');if(t.pos>=r.goal){r.win=t;r.msg+=' Lên đỉnh trước tiên!'}}else{const b=t.pos>=5?5:0;r.msg=t.n+' trả lời sai, rơi về '+(b?'mốc an toàn bậc 5':'vạch xuất phát')+'!';t.pos=b}}
 else if(r.g==='bomb'){clearInterval(r.iv);if(ok)r.msg=t.n+' chuyền bom thành công!';else{t.lv--;r.msg=(k<0?'Hết giờ! ':'Sai rồi! ')+'Bùm! '+t.n+' '+gmRn(GBM)+(t.lv>0?', còn '+t.lv+' mạng.':', bị loại!');const al=r.tm.filter(x=>x.lv>0);if(al.length<=1){r.win=al[0]||t;r.msg+=' Trò chơi kết thúc.'}}}
 else if(r.g==='tower'){if(ok){t.pos++;r.msg=t.n+' xếp thêm 1 tầng!';if(t.pos>=r.goal){r.win=t;r.msg+=' Tháp chạm nóc, chiến thắng!'}}else if(Math.random()<.5&&t.pos>0){t.pos--;r.msg='Tháp của '+t.n+' lung lay, rớt 1 tầng!'}else r.msg='Tháp của '+t.n+' suýt đổ nhưng vẫn đứng vững!'}
 else if(r.g==='boss'){if(ok){const d=12+(Math.random()*9|0);r.hp-=d;t.sc+=d;r.msg=t.n+' tung chiêu, boss mất '+d+' máu!';if(r.hp<=0){r.win={ico:'🏆',n:'Cả lớp hạ gục boss',m:[]};r.msg+=' Boss gục ngã!'}}else{r.hearts--;r.msg='Boss '+gmRn(GBS)+'! Cả đội mất 1 tim.';if(r.hearts<=0){r.win={ico:'👾',n:'Boss thắng',m:[]};r.msg+=' Hết tim rồi!'}}}
 else if(r.g==='arch'){r.tc++;if(ok){const w=[10,20,30,25,15];let x=Math.random()*100,k=0;while(k<4&&x>=w[k]){x-=w[k];k++}const a=Math.random()*6.283,rc=k*20+10;r.hx=Math.round(100+rc*Math.cos(a));r.hy=Math.round(100+rc*Math.sin(a));const p=10-k*2;t.sc+=p;r.msg=t.n+' bắn trúng vòng '+p+' điểm!'}else r.msg=t.n+' bắn trượt, mũi tên '+gmRn(GAR)+'!'}
 else if(ok){r.ph='roll';r.v=1+(Math.random()*6|0);gmUp();requestAnimationFrame(()=>requestAnimationFrame(()=>{const e=$('cube'),o=GO[r.v];if(e)e.style.transform=`rotateX(${o[0]+720}deg) rotateY(${o[1]+720}deg)`}));
  setTimeout(()=>{if(!GM.run||GM.run!==r)return;t.pos+=r.v;r.msg=t.n+' tung được '+r.v+', tiến '+r.v+' ô!';if(t.pos>=r.goal){r.win=t;r.msg+=' Về đích!'}r.ph='res';gmUp()},1500);return}
 else r.msg=t.n+' '+gmRn(GFN)+', mất lượt tung xúc xắc!';
 r.ph='res';gmUp()}
function gmNext(){const r=GM.run;clearInterval(r.iv);
 if(r.win||(r.g==='flip'&&r.cards.every(c=>c.o))||((r.g==='wheel'||r.g==='arch')&&r.tc>=r.tm.length*4))r.ph='end';
 else{do{r.t=(r.t+1)%r.tm.length}while(r.g==='bomb'&&r.tm[r.t].lv<=0);r.ph=r.g==='flip'?'pick':'ask';if(r.ph==='ask')gmQ()}gmUp()}
function gmLL(){const r=GM.run,t=r.tm[r.t];if(r.ph!=='ask'||!t.ll)return;t.ll=0;r.hid=shuf([0,1,2,3].filter(k=>k!==r.q.c&&k<r.q.o.length)).slice(0,2);gmUp()}
/* --- Bộ câu hỏi: nhập theo form có sẵn, giao cho từng lớp --- */
function gmCells(l){const d=l.includes('|')?'|':l.includes('\t')?'\t':l.includes(';')&&!l.includes(',')?';':',',o=[];let c='',q=0;for(const ch of l){if(ch==='"')q=!q;else if(ch===d&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o}
function gmParse(t){return t.replace(/^\uFEFF/,'').split(/\r?\n/).map(gmCells).filter(a=>a[0]&&a[1]&&a[2]&&!/^câu hỏi$/i.test(a[0])).map(a=>({q:a[0],o:[a[1],...a.slice(2,5).filter(Boolean)],a:0}))}
function gmBanks(){const cl=D.years.flatMap(y=>y.classes.map(c=>[c.id,y.name+' · '+c.name]));
 return `<div class="card"><b>Bộ câu hỏi trò chơi</b><p class="mu">Mỗi dòng một câu theo form: <code>Câu hỏi | Đáp án đúng | Sai 1 | Sai 2 | Sai 3</code>. Có thể dán từ Excel hoặc nhập file CSV (tải file mẫu để điền).</p>
<div class="row"><input id="qbn" placeholder="Tên bộ câu hỏi"><label>Nhập file <input type="file" accept=".csv,.txt,.tsv" onchange="gmFile(this)"></label><button onclick="gmTpl()">Tải file mẫu</button></div>
<textarea id="qbt" placeholder="Dán các dòng câu hỏi vào đây"></textarea><div class="row"><button class="p" onclick="gmAdd()">Tạo bộ câu hỏi</button></div>
${qb().map(b=>`<div class="it" style="cursor:default;display:block"><div class="row"><b>${H(b.name)}</b><span class="mu">${b.qs.length} câu</span><span class="sp"></span><button class="d" onclick="gmDel('${b.id}')">Xoá</button></div><div class="mu">Giao cho lớp (không chọn lớp nào = dùng cho mọi lớp):</div>${cl.map(x=>`<label style="margin-right:12px"><input type="checkbox" ${b.cids.includes(x[0])?'checked':''} onchange="gmCid('${b.id}','${x[0]}',this.checked)"> ${H(x[1])}</label>`).join('')}</div>`).join('')}</div>`}
function gmFile(e){const f=e.files[0];if(f)f.text().then(t=>{$('qbt').value=t.replace(/^\uFEFF/,'');if(!$('qbn').value)$('qbn').value=f.name.replace(/\.[^.]+$/,'')})}
function gmTpl(){const t='\uFEFFCâu hỏi,Đáp án đúng,Đáp án sai 1,Đáp án sai 2,Đáp án sai 3\nTác giả của Truyện Kiều là ai?,Nguyễn Du,Nguyễn Trãi,Hồ Xuân Hương,Tố Hữu\nThể thơ lục bát có các dòng thơ lần lượt bao nhiêu tiếng?,6 và 8,5 và 7,7 và 7,4 và 4\nBiện pháp tu từ so sánh thường có từ nào?,Như,Bởi,Nhưng,Vì\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='mau-cau-hoi.csv';a.click()}
function gmAdd(){const n=$('qbn').value.trim(),qs=gmParse($('qbt').value);if(!n)return toast('Nhập tên bộ câu hỏi');if(!qs.length)return toast('Chưa đọc được câu hỏi nào, kiểm tra lại form');
 qb().push({id:'q'+Date.now().toString(36)+(Math.random()*1e4|0),name:n,cids:[],qs});save();render();toast('Đã tạo bộ câu hỏi '+qs.length+' câu')}
function gmDel(id){if(!confirm('Xoá bộ câu hỏi này?'))return;D.qb=qb().filter(b=>b.id!==id);save();render()}
function gmCid(id,c,on){const b=qb().find(x=>x.id===id);b.cids=b.cids.filter(x=>x!==c);if(on)b.cids.push(c);save()}
const _render=render;
render=function(){_render();const w=document.createTreeWalker($('app'),NodeFilter.SHOW_TEXT),L=[];
 while(w.nextNode()){const n=w.currentNode;if(!n.parentElement.closest('pre,textarea,select,option'))L.push(n)}
 L.forEach(n=>{const t=n.data.replace(/\uFE0F/g,'');if(t.search(ER)<0)return;const sz=parseInt(n.parentElement.style.fontSize)||18,tp=document.createElement('template');tp.innerHTML=H(t).replace(ER,m=>ic(EMO[m],sz));n.replaceWith(tp.content)})};
addEventListener('visibilitychange',()=>{if(document.hidden)flush()});addEventListener('pagehide',flush);
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='lop-van-thay-hieu.json';a.click()}
function rs(e){const f=e.files[0];if(!f)return;f.text().then(t=>{try{D=Object.assign(D,JSON.parse(t));save();me=D.users.find(x=>x.u===me.u)||null;render();toast('Đã khôi phục')}catch(x){toast('File không hợp lệ')}})}
(async()=>{try{const v=await idb.get();if(v&&(v.ts||0)>=(D.ts||0))D=Object.assign(D,v)}catch(e){}try{const u=localStorage.getItem('lvth_me');me=D.users.find(x=>x.u===u)||null;if(me&&me.off)me=null}catch(e){}if(!me)await sRestore();render()})();
</script></body></html>
